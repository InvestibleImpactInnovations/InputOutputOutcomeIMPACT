<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#004aad">
<title>Pick Your Style – an Impact MOAT game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#004aad;--dg:#16a637;--lg:#7ed957;--mute:#4f72ae;--line:#cfdcf1}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--blue);color:#fff;font:500 16px/1.5 Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;min-height:100dvh}
body::before,body::after{content:"";position:fixed;border-radius:50%;z-index:0;pointer-events:none;background:rgba(255,255,255,.07)}
body::before{width:420px;height:420px;right:-210px;top:-210px}
body::after{width:480px;height:480px;left:-250px;bottom:-250px}
.app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;justify-content:center;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 4px}
.pill{background:#fff;color:var(--blue);font-weight:800;font-size:12px;letter-spacing:.14em;padding:9px 18px;border-radius:999px;text-transform:uppercase;text-align:center}
main{flex:1;width:100%;max-width:520px;margin:0 auto;padding:12px 18px 18px}
.foot{text-align:center;color:#fff;font-weight:800;letter-spacing:.22em;font-size:17px;padding:10px 0 calc(18px + env(safe-area-inset-bottom,0px))}
.screen{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}html{scroll-behavior:auto}}
h1{font-size:clamp(26px,8vw,34px);line-height:1.12;font-weight:800;margin:22px 0 14px;text-align:center}
h2{font-size:clamp(22px,6.6vw,28px);line-height:1.3;font-weight:800;margin:6px 0 10px;text-align:center}
h2 em{font-style:normal;border-radius:10px;padding:1px 9px;background:var(--dg);color:#fff}
h2 em.d{background:var(--lg);color:var(--blue)}
p{margin:0 0 12px}.center{text-align:center}
.light{color:rgba(255,255,255,.88);font-weight:600}
.card{background:#fff;color:var(--blue);border:3px solid #fff;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 10px 24px rgba(0,20,60,.22)}
.card.b{border-color:var(--dg)}.card.d{border-color:var(--lg)}
.fork{display:block;width:100%;max-width:340px;margin:0 auto}
.btn{display:block;width:100%;border:0;border-radius:999px;background:var(--lg);color:var(--blue);font-weight:800;font-size:18px;line-height:1.2;font-family:inherit;padding:17px 20px;cursor:pointer;margin-top:14px;box-shadow:0 8px 18px rgba(0,20,60,.3)}
.btn.alt{background:transparent;color:#fff;border:2px solid #fff;box-shadow:none;font-size:16px;padding:12px 20px;margin-top:10px}
.btn:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.lab{display:inline-block;font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:5px 12px;margin-bottom:8px}
.lab.b{background:var(--dg);color:#fff}.lab.d{background:var(--lg);color:var(--blue)}
.list{margin:0 0 8px;font-weight:700;font-size:15px;line-height:1.4}
.note{font-size:13px;color:var(--mute);margin:0 0 8px}
.go{margin:0;font-size:15px}
.go b{border-radius:8px;padding:1px 7px;font-weight:800}.go b.b{background:var(--dg);color:#fff}.go b.d{background:var(--lg);color:var(--blue)}
.prog{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin:4px 2px 6px;color:#fff}
.track{height:9px;background:rgba(255,255,255,.3);border-radius:6px;overflow:hidden;margin-bottom:12px}
.track i{display:block;height:100%;background:var(--lg);border-radius:6px;transition:width .35s ease}
.chip{display:inline-block;border:2px solid var(--blue);color:var(--blue);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:4px 12px}
.idea{display:flex;gap:14px;align-items:center;margin:12px 0 8px}
.idea img.g{width:72px;height:72px;flex:none}
.idea p{margin:0;font-size:clamp(19px,5.6vw,23px);line-height:1.25;font-weight:800}
.ask{font-weight:600;color:var(--mute);margin:0}
.opt{display:block;width:100%;text-align:left;font-family:inherit;border-radius:20px;border:3px solid #fff;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.opt b{display:block;font-size:19px;font-weight:800}.opt span{font-size:14px;font-weight:600}
.opt.i{background:var(--dg);color:#fff}.opt.x{background:var(--lg);color:var(--blue)}
.opt:disabled{cursor:default}.opt.dim{opacity:.45}.opt.on{box-shadow:0 0 0 4px rgba(255,255,255,.45)}
.fb{background:#fff;color:var(--blue);border-radius:22px;border-top:12px solid var(--acc,var(--blue));padding:14px 16px;margin-top:4px;box-shadow:0 10px 24px rgba(0,20,60,.22)}
.fbh{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;margin-bottom:6px}
.fbh .ico{width:34px;height:34px;border-radius:50%;background:var(--dg);color:#fff;display:grid;place-items:center;flex:none;font-size:19px}
.fb.no .fbh .ico{background:var(--blue)}
.fbrow{display:flex;gap:12px;align-items:flex-start}
.fbrow p{margin:0 0 8px;font-size:15px;line-height:1.45}
img.sdg{width:80px;height:80px;border-radius:12px;flex:none}
.lvl{display:inline-block;font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:4px 11px;margin-bottom:8px}
.lvl.b{background:var(--dg);color:#fff}.lvl.d{background:var(--lg);color:var(--blue)}
.big{font-size:64px;font-weight:800;line-height:1;text-align:center;margin:8px 0 2px}
.moat{display:flex;align-items:center;gap:14px;background:#fff;color:var(--blue);border-radius:22px;padding:12px 16px;margin:14px 0 0;box-shadow:0 10px 24px rgba(0,20,60,.22)}
.moat img{width:96px;height:auto;flex:none}
.moat p{margin:0;font-size:15px;font-weight:600;line-height:1.4}
.moat b{font-weight:800}
.sdgs{display:flex;justify-content:center;gap:10px;margin:14px 0 4px}
.sdgs img{width:64px;height:64px;border-radius:10px}
</style>
</head>
<body>
<div class="app">
<header><div class="pill">Impact MOAT · Free Game</div></header>
<main id="stage"></main>
<div class="foot">FREE COURSE</div>
</div>

show('<h1>Which innovation style fits your impact idea?</h1>'+

}
function intro2(){
show('<h2>Incremental or <em class="d">disruptive</em>?</h2>'+
'<p class="center light" style="margin-bottom:12px">How much does your sector already contribute to the Global Goals?</p>'+
'<div class="card b"><span class="lab b">High contributors</span><p class="list">Agriculture · Pharmaceuticals · Hotels &amp; Lodging</p><p class="go"><b class="b">Go incremental:</b> keep improving, and distribute the good further.</p></div>'+
'<div class="card d"><span class="lab d">Poorest performers</span><p class="list">Finance · Services &amp; Transportation · Infrastructure · Technology</p><p class="note">Poorest subsectors: Exchanges &amp; Commodities, Advertising &amp; Marketing, Education and Tobacco.</p><p class="go"><b class="d">Go disruptive:</b> change how the market works.</p></div>'+

function start(){
ev('pick-your-style-start');
Q=IDEAS.slice();for(var i=Q.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=Q[i];Q[i]=Q[j];Q[j]=t}
n=0;score=0;locked=false;card();
}
function card(){
var c=Q[n];
show('<div class="prog"><span>Idea '+(n+1)+' of '+Q.length+'</span><span>Score '+score+'</span></div>'+
'<div class="track"><i style="width:'+(n/Q.length*100)+'%"></i></div>'+
'<div class="card"><span class="chip">Sector: '+c.s+'</span>'+
'<div class="idea"><img class="g" src="'+IMG["g_"+c.g]+'" alt=""><p>'+c.i+'</p></div>'+
'<p class="ask">Which style fits?</p></div>'+
'<button class="opt i" id="o1" onclick="pick(1)"><b>Incremental</b><span>Improve and distribute the good</span></button>'+
'<button class="opt x" id="o0" onclick="pick(0)"><b>Disruptive</b><span>Change how the market works</span></button>'+
'<div id="fb" aria-live="polite"></div>');
}
function pick(v){
if(locked)return;locked=true;
var c=Q[n],ok=(v===c.lv);if(ok)score++;
var b1=document.getElementById("o1"),b0=document.getElementById("o0");
b1.disabled=b0.disabled=true;
(v?b1:b0).classList.add("on");(v?b0:b1).classList.add("dim");
var path=c.lv?"incremental":"disruptive",cls=c.lv?"b":"d";

document.getElementById("fb").innerHTML=
'<div class="fb'+(ok?'':' no')+'" style="--acc:'+c.acc+'"><div class="fbh"><span class="ico">'+(ok?'✓':'!')+'</span>'+(ok?'Yes!':'Not quite.')+'</div>'+
'<div class="fbrow"><div><span class="lvl '+cls+'">'+c.tag+'</span><p>The better style is <b>'+path+'</b>. '+c.w+'</p></div>'+tile+'</div></div>'+
'<button class="btn" id="next" onclick="next()">'+(n<Q.length-1?'Next idea':'See my result')+'</button>';
var nb=document.getElementById("next");nb.focus({preventScroll:true});
nb.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function next(){locked=false;n++;if(n<Q.length)card();else end()}

function end(){
ev('pick-your-style-finish');
var m=score>=5?"You read the sectors very well.":score>=3?"Good instincts. Check the sectors you missed.":"Worth another round: the sector decides the style.";
show('<h2>Your result</h2><div class="big">'+score+' / '+Q.length+'</div><p class="center" style="font-weight:700;margin-top:6px">'+m+'</p>'+
'<div class="moat"><img src="'+IMG.wheel+'" alt="Sustainable Development Goals wheel"><p><b>Impact MOAT:</b> your sector choice decides how you contribute to the Global Goals.</p></div>'+
'<div class="sdgs"><img src="'+IMG.sdg2+'" alt="Zero Hunger"><img src="'+IMG.sdg3+'" alt="Good Health and Well-being"><img src="'+IMG.sdg4+'" alt="Quality Education"><img src="'+IMG.sdg6+'" alt="Clean Water and Sanitation"></div>'+
'<div class="card" style="margin-top:12px"><p style="margin:0">Active in one of the poorest sectors? Go for <b>disruptive impact innovation</b>. Active in a top contributor? Improve it and distribute the good further. It is all about your impact type and what for.</p></div>'+
'<button class="btn" onclick="share()">Share with a friend</button>'+
'<button class="btn alt" onclick="start()">Play again with a new order</button><p class="center" id="shmsg" style="margin:8px 0 0;min-height:20px;font-weight:700"></p>');
}
var LINK='https://investibleimpactinnovations.github.io/Innovate-for-the-Global-Goals/';
function share(){
ev('pick-your-style-share');
var txt='I got '+score+' / '+Q.length+' on Pick Your Style. Can you beat me? Play the Game (Free Course): ';
var msg=document.getElementById('shmsg');
function copied(){if(msg)msg.textContent='Link copied. Paste it to a friend!'}
if(navigator.share){navigator.share({title:'Pick Your Style',text:txt,url:LINK}).catch(function(){})}
else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt+LINK).then(copied,function(){if(msg)msg.textContent=LINK})}
else if(msg){msg.textContent=LINK}
}
intro();
</script>
<script data-goatcounter="https://investibleimpactinnovation.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
